# รุ่นไม่ใช้ G Hub (branch native): push → build แล้วออก prerelease แท็ก native-v2.0.<ลำดับการรัน>
# ตัว G Hub (main) ดูแค่ releases/latest จึงไม่เห็นรุ่นนี้ — ติดตั้งแยกโฟลเดอร์ อัปเดตแยกกัน
name: release

on:
  push:
    branches: [native]
    paths:
      - 'GunBeepApp/**'
      - 'recoil.lua'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      VERSION: 2.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        shell: pwsh
        run: dotnet publish GunBeepApp/GunBeep.csproj -c Release -o publish -p:Version=$env:VERSION

      - name: Package
        shell: pwsh
        run: |
          Copy-Item recoil.lua, README.md, CLAUDE.md publish/
          Compress-Archive -Path publish/* -DestinationPath GunBeepNative-win-x64.zip

      - name: Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = git log -1 --pretty=%B
          gh release create "native-v$env:VERSION" GunBeepNative-win-x64.zip --prerelease --target native --title "GunBeep ไม่ใช้ G Hub v$env:VERSION" --notes "$notes"
